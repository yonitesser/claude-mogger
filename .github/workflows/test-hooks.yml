name: test-hooks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: run every test suite (in parallel; report all failures, not just the first)
        run: |
          mkdir -p /tmp/suites
          ls tests/*.test.sh | xargs -P 4 -I{} sh -c 'n=$(basename {}); bash {} > /tmp/suites/$n.log 2>&1; echo $? > /tmp/suites/$n.rc'
          fail=0
          : > /tmp/all-tests.log
          for t in tests/*.test.sh; do
            n=$(basename "$t")
            echo "== $t" | tee -a /tmp/all-tests.log
            cat "/tmp/suites/$n.log" | tee -a /tmp/all-tests.log
            [ "$(cat /tmp/suites/$n.rc)" = 0 ] || { echo "::error::$t failed"; fail=1; }
          done
          echo "=========== FAILED-LINES-SUMMARY ==========="
          grep -E '^[[:space:]]*FAIL|^== tests/|passed[:,]? .*failed' /tmp/all-tests.log | grep -B1 -E 'FAIL|[1-9][0-9]* failed|failed: [1-9]' || true
          exit $fail
      - name: manifests are valid JSON
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','.mcp.json','incoming/.claude/settings.json']]"
      - name: incoming/ is in sync with plugin
        run: |
          cp -r incoming /tmp/incoming-before
          bash scripts/sync-incoming.sh >/dev/null
          diff -r /tmp/incoming-before incoming
